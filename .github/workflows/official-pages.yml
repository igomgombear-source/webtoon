name: Official webtoon site

on:
  push:
    branches: [official-pages]
  workflow_dispatch:

concurrency:
  group: official-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/official-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Advance this SHA only after a new source revision has been approved for release.
      - uses: actions/checkout@v4
        with:
          ref: b80cde5182b2f84677b967731641daf761af4dfa
          persist-credentials: false
      - name: Package approved reader files
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const assert = require('node:assert/strict');
          const read = file => fs.readFileSync(file, 'utf8');
          const window = {};
          const context = vm.createContext(window);
          context.window = window;
          vm.runInContext(read('data/episodes.js'), context);
          const webtoon = window.WEBTOON;
          context.WEBTOON = webtoon;

          const assets = new Set([
            '.nojekyll',
            'assets/fonts/NanumPenScript-OFL.txt', 'assets/fonts/NotoSerifKR-OFL.txt',
            'assets/fonts/Pretendard-OFL.txt',
            'assets/fonts/nanum-pen-cover.woff', 'assets/fonts/NotoSerifKR-Medium.subset.woff',
            'assets/fonts/Pretendard-Medium.subset.woff2', 'assets/fonts/Pretendard-SemiBold.subset.woff2',
          ]);
          const index = read('index.html');
          for (const [, file] of index.matchAll(/(?:src|href)="((?:css|js|data)\/[a-z0-9.-]+)"/g))
            assets.add(file);
          const published = webtoon.series.episodes.filter(episode => episode.ready);
          for (const episode of published) {
            assert.match(episode.file, /^data\/ep[0-9]+(?:v[0-9]+)?\.js$/);
            assets.add(episode.file);
            vm.runInContext(read(episode.file), context);
          }
          assert.equal(webtoon.episodeData.ep01v3.cuts.length, 104);   // 원본 데이터 104컷
          assert.equal(webtoon.episodeData.ep01v3.cuts.filter(cut => cut.reader !== false).length, 99);   // 독자 화면 99컷

          function addArtwork(file, imageBase = '') {
            if (!file) return;
            const local = file.startsWith('assets/') ? file : imageBase + file;
            assert.match(local, /^assets\/(?:cuts|episodes|phone)\/(?:[-a-zA-Z0-9_]+\/)*[-a-zA-Z0-9_.]+\.(?:webp|png|svg|jpe?g)$/);
            assets.add(local);
          }
          for (const {cuts, imageBase} of Object.values(webtoon.episodeData)) {
            for (const cut of cuts) {
              for (const panel of [cut, ...(cut.rows || []).flat()]) {
                addArtwork(panel.image, imageBase);
                addArtwork(panel.nameplate, imageBase);
              }
              addArtwork(cut.inset?.image, imageBase);
              addArtwork(cut.phone?.wall);
            }
          }
          vm.runInContext(read('data/ep01v3-screens.js'), context);
          for (const episode of published) {
            for (const screen of Object.values(webtoon.screens?.[episode.id] || {}).flat()) {
              addArtwork(screen.wall);
              addArtwork(screen.photo?.src);
              addArtwork(screen.fg?.src);
            }
          }

          fs.mkdirSync('_site', {recursive: true});
          for (const file of assets) {
            assert.ok(fs.lstatSync(file).isFile(), file);
            const target = path.join('_site', file);
            fs.mkdirSync(path.dirname(target), {recursive: true});
            fs.copyFileSync(file, target);
          }
          const robots = '<meta name="robots" content="noindex, nofollow">';
          fs.writeFileSync('_site/index.html', index.replace('<head>', '<head>\n' + robots));
          fs.writeFileSync('_site/404.html', '<!doctype html><html lang="ko"><head><meta charset="utf-8">' +
            '<meta name="viewport" content="width=device-width, initial-scale=1">' + robots +
            '<title>페이지를 찾을 수 없습니다</title></head><body><h1>페이지를 찾을 수 없습니다</h1>' +
            '<p><a href="/webtoon/">마지막 접속 웹툰 보기</a></p></body></html>\n');
          console.log('Approved reader files:', assets.size + 2, 'Episodes:', published.map(episode => episode.no));
          JS
      - name: Mobile browser check at 360 pixels
        run: |
          npm install --prefix "$RUNNER_TEMP/webtoon-qa" --no-audit --no-fund playwright-core@1.55.0
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 --silent http://127.0.0.1:8765/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/webtoon-qa/node_modules" node <<'JS'
          const {chromium} = require('playwright-core');
          const assert = require('node:assert/strict');
          async function check() {
            const browser = await chromium.launch({channel: 'chrome'});
            try {
              const page = await browser.newPage({viewport:{width:360,height:800}, isMobile:true,
                hasTouch:true, deviceScaleFactor:1, reducedMotion:'reduce'});
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.goto('http://127.0.0.1:8765/#ep01v3');
              await page.locator('[data-no="104"]').waitFor();
              assert.equal(await page.locator('.cut[data-no]').count(), 99);   // 16·59·60·85·86 숨김
              for (const no of [16,59,60,85,86]) assert.equal(await page.locator('.cut[data-no="' + no + '"]').count(), 0);
              assert.match(await page.locator('meta[name="robots"]').getAttribute('content'), /noindex/);
              const decoded = await page.locator('.cut .art-img').evaluateAll(async images => {
                for (const image of images) image.loading = 'eager';
                await Promise.all(images.map(image => image.decode()));
                return images.length;
              });
              console.log('360px all artwork decoded:', decoded);
              for (const [no,count] of [[1,5],[41,1],[43,1],[57,1],[89,1],[94,2]]) {
                const cut = page.locator('.cut[data-no="' + no + '"]');
                const art = cut.locator('.art-img');
                assert.equal(await art.count(),count);
                for (const image of await art.all()) {
                  await image.scrollIntoViewIfNeeded();
                  await image.evaluate(img => img.decode());
                }
                if (no === 1) {
                  const names = cut.locator('.art-lettering');
                  assert.equal(await names.count(),5);
                  for (const name of await names.all()) await name.evaluate(img => img.decode());
                }
                if (no === 43) assert.match((await cut.innerText()).replace(/\s+/g, ' '),/휴대폰은 미리 무음으로 해 주세요/);
                if (no === 43) {
                  const bounds = await cut.locator('.bv4-text').evaluateAll(nodes => nodes.map(node => {
                    const {left, right, height} = node.getBoundingClientRect();
                    return height > 0 && left >= 0 && right <= innerWidth;
                  }));
                  assert.ok(bounds.length >= 2 && bounds.every(Boolean), 'Cut 43 visible dialogue');
                }
                if (no === 57) assert.equal(await cut.locator('.scr-clock').count(),1);
                if (no === 94) {
                  const screens = await cut.locator('.scr-ui').evaluateAll(nodes => nodes.map(node => {
                    const {width, height} = node.getBoundingClientRect();
                    return width > 0 && height > 0 && getComputedStyle(node).transform !== 'none';
                  }));
                  assert.deepEqual(screens, [true, true], 'Cut 94 phone overlays');
                  for (const fg of await cut.locator('.scr-fg').all()) await fg.evaluate(img => img.decode());
                }
                console.log('360px cut',no,'rendered');
              }
              assert.deepEqual(await page.evaluate(() => [document.documentElement.clientWidth, document.documentElement.scrollWidth]),[360,360]);
              assert.deepEqual(errors,[]);
            } finally {
              await browser.close();
            }
          }
          check().catch(error => {console.error(error); process.exitCode = 1;});
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
