<script>
// 7세그먼트 18:34
const seg={0:'abcdef',1:'bc',2:'abged',3:'abgcd',4:'fgbc',5:'afgcd',6:'afgedc',7:'abc',8:'abcdefg',9:'abcfgd'};
function digit(x,y,n,s){const w=7*s,h=12*s,t=1.6*s;const P={a:[0,0,w,t],b:[w-t,0,t,h/2],c:[w-t,h/2,t,h/2],d:[0,h-t,w,t],e:[0,h/2,t,h/2],f:[0,0,t,h/2],g:[0,h/2-t/2,w,t]};
 return seg[n].split('').map(k=>{const r=P[k];return `<rect x="${x+r[0]}" y="${y+r[1]}" width="${r[2]}" height="${r[3]}" rx="${t/3}" fill="#5dff9a"/>`}).join('');}
const s=1.25,y0=591;let h='';const xs=[999,1009.5,1023,1033.5];[1,8,3,4].forEach((n,i)=>h+=digit(xs[i],y0,n,s));
h+=`<rect x="1019.4" y="${y0+3.5}" width="2" height="2" fill="#5dff9a"/><rect x="1019.4" y="${y0+10}" width="2" height="2" fill="#5dff9a"/>`;
document.getElementById('clock').innerHTML=h+`<rect x="996" y="584" width="48" height="30" fill="#5dff9a" opacity=".12" filter="url(#blur3)"/>`;
</script></body></html>
