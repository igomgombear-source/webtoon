<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="np.css">
<style>

 border:14px solid #b9bec4;box-shadow:0 10px 26px rgba(40,30,20,.35), inset 0 0 0 2px #8e949b, inset 0 0 40px rgba(120,130,140,.18);transform:rotate(-1.2deg)}

.smudge{position:absolute;background:rgba(90,100,120,.07);filter:blur(6px);border-radius:20px}

.tray{position:absolute;left:170px;top:546px;width:780px;height:22px;background:linear-gradient(#c9ced3,#9aa0a7);border-radius:3px;box-shadow:0 4px 8px rgba(0,0,0,.25);transform:rotate(-1.2deg)}
.mk{position:absolute;top:-14px;height:16px;border-radius:8px}

 <span class="smudge" style="left:500px;top:52px;width:220px;height:40px"></span><span class="smudge" style="left:560px;top:380px;width:170px;height:34px"></span>
 <span class="t h">10/31 (토)</span>
