<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EP01 수정 시안 비교 (검수용)</title>
<style>
:root { --bg:#0e1116; --panel:#171b22; --line:#2a313b; --text:#e6e8eb; --dim:#9aa3ad; --accent:#c9a96a; --ok:#4cc38a; --hold:#e0b341; --no:#e5675c; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
header.top { position:sticky; top:0; z-index:5; background:rgba(14,17,22,.96); border-bottom:1px solid var(--line); padding:10px 12px 8px; }
header.top h1 { margin:0; font-size:16px; }
header.top p { margin:2px 0 8px; font-size:12px; color:var(--dim); }
nav.chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
nav.chips a { flex:none; padding:5px 11px; border:1px solid var(--line); border-radius:999px; color:var(--text); text-decoration:none; font-size:13px; }
nav.chips a.done::after { content:" ●"; color:var(--ok); font-size:10px; }
main { padding:12px 12px 80px; max-width:720px; margin:0 auto; }
.notice { padding:10px 12px; border:1px dashed var(--line); border-radius:10px; color:var(--dim); font-size:13px; margin-bottom:14px; }
section.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:18px; scroll-margin-top:92px; }
.card h2 { margin:0 0 2px; font-size:17px; }
.card .what { margin:0 0 10px; font-size:13px; color:var(--dim); }
.seg { display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:10px; }
.seg button { flex:1; padding:11px 4px; background:transparent; color:var(--dim); border:0; font:inherit; font-size:14px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button[aria-pressed="true"] { background:var(--accent); color:#1a1408; font-weight:700; }
.persons { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.persons button { padding:6px 12px; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--text); font:inherit; font-size:13px; }
.persons button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
.stage { position:relative; background:#000; border-radius:8px; overflow:hidden; line-height:0; cursor:zoom-in; touch-action:manipulation; }
.stage .layer { position:relative; line-height:0; }
.stage img { display:block; width:100%; height:auto; }
.stage .layer img + img { position:absolute; left:0; top:0; }
.stage .cmp { position:absolute; inset:0; }
.stage .tag { position:absolute; left:8px; top:8px; z-index:2; padding:3px 9px; border-radius:999px; background:rgba(0,0,0,.65); font-size:12px; font-weight:700; line-height:1.4; color:#fff; pointer-events:none; }
.stage .tag.new { background:rgba(201,169,106,.92); color:#1a1408; }
.stage .none { padding:44px 14px; text-align:center; color:var(--dim); font-size:14px; line-height:1.5; }
.slider { display:none; margin:8px 0 0; }
.slider.on { display:block; }
.slider input { width:100%; height:34px; }
.hint { margin:6px 0 0; font-size:12px; color:var(--dim); }
.box { margin-top:10px; padding:10px 12px; background:#10141a; border:1px solid var(--line); border-radius:10px; font-size:14px; }
.box b { color:var(--accent); }
.box .old { color:var(--dim); text-decoration:line-through; text-decoration-color:rgba(154,163,173,.5); }
.box small { display:block; margin-top:6px; color:var(--dim); font-size:12px; }
.verdict { display:flex; gap:6px; margin-top:12px; }
.verdict button { flex:1; padding:11px 0; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); font:inherit; font-size:14px; }
.verdict button[aria-pressed="true"][data-v="ok"] { background:var(--ok); border-color:var(--ok); color:#06210f; font-weight:700; }
.verdict button[aria-pressed="true"][data-v="hold"] { background:var(--hold); border-color:var(--hold); color:#241a02; font-weight:700; }
.verdict button[aria-pressed="true"][data-v="no"] { background:var(--no); border-color:var(--no); color:#2b0905; font-weight:700; }
.sum { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:rgba(14,17,22,.97); border-top:1px solid var(--line); }
.sum button { flex:1; padding:12px 0; border-radius:10px; border:1px solid var(--accent); background:transparent; color:var(--accent); font:inherit; font-size:15px; font-weight:700; }
.sum span { align-self:center; font-size:12px; color:var(--dim); min-width:64px; }
pre.out { white-space:pre-wrap; background:#10141a; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.55; margin:0 0 14px; display:none; }
pre.out.on { display:block; }
/* 확대 보기 */
#zoom { position:fixed; inset:0; z-index:20; background:#000; display:none; flex-direction:column; }
#zoom.on { display:flex; }
#zoom .bar { flex:none; display:flex; gap:8px; align-items:center; padding:8px 10px; background:#0b0d11; border-bottom:1px solid var(--line); }
#zoom .bar .seg { flex:1; margin:0; }
#zoom .bar .close { flex:none; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); font:inherit; }
#zoom .view { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
#zoom .view .inner { position:relative; width:260%; line-height:0; }
#zoom .view img { display:block; width:100%; height:auto; }
#zoom .view .inner img + img { position:absolute; left:0; top:0; }
#zoom .cap { flex:none; padding:6px 12px calc(6px + env(safe-area-inset-bottom)); font-size:12px; color:var(--dim); background:#0b0d11; }
</style>
</head>
<body>
<header class="top">
  <h1>EP01 수정 시안 비교 <span style="color:var(--dim);font-weight:400">· 미승인 후보</span></h1>
  <p>컷마다 기존 원화 ↔ 수정 시안을 전환해 보고 판단을 눌러 주세요. 본편에는 연결되지 않았습니다.</p>
  <nav class="chips" id="chips"></nav>
</header>
<main>
  <div class="notice">이미지를 탭하면 크게 열립니다(좌우·상하로 밀어 확대 부분을 봅니다). 판단은 이 기기에만 저장되며, 하단 <b>요약 보기</b>로 한 번에 정리됩니다. 실제 웹툰 화면은 <a href="../index.html#ep01v3" style="color:var(--accent)">index.html#ep01v3</a> 입니다.</div>
  <pre class="out" id="out"></pre>
  <div id="cards"></div>
</main>
<div class="sum"><span id="count">0 / 8 판단</span><button id="show">요약 보기</button><button id="copy">요약 복사</button></div>
<div id="zoom" aria-hidden="true">
  <div class="bar"><div class="seg" id="zseg"></div><button class="close" id="zclose">닫기</button></div>
  <div class="view" id="zview"><div class="inner" id="zinner"></div></div>
  <div class="cap" id="zcap"></div>
</div>

<script>
/* 본편 데이터(읽기만): 43컷 현재 대사를 그대로 보여 주기 위해 불러온다. 이 페이지는 데이터를 바꾸지 않는다. */
window.WEBTOON = { episodeData: {}, registerEpisode: function (e) { this.episodeData[e.id] = e; } };
</script>
<script src="../data/ep01v3.js"></script>
<script>
(function () {
  'use strict';
  var A = '../assets/cuts/ep01v3/';
  function f(n) { return A + n; }

  /* old/new: 이미지 층 목록(위로 겹침) 또는 null(기존 없음). 표시되는 문구만 이 파일에서 관리한다. */
  var ITEMS = [
    { id: 'c01', cut: '1컷', title: '등장인물 5명 초상·이름', what: '1컷과 같은 액자 초상 연출을 인물별로 확장하고 이름 글자를 얹은 시안. 본편 1컷은 승민 초상 하나뿐입니다.',
      persons: [
        { key: 'seungmin', name: '이승민', old: [f('ep01v3-001-opening-portrait-DRAFT.webp')], neu: [f('ep01v3-001-opening-portrait-DRAFT.webp'), f('ep01v3-001-seungmin-name-DRAFT.svg')], oldNote: '본편 1컷(이름 없음)' },
        { key: 'haein', name: '권해인', old: null, neu: [f('ep01v3-001-haein-portrait-DRAFT.webp'), f('ep01v3-001-haein-name-DRAFT.svg')] },
        { key: 'hyoeun', name: '임효은', old: null, neu: [f('ep01v3-001-hyoeun-portrait-DRAFT.webp'), f('ep01v3-001-hyoeun-name-DRAFT.svg')] },
        { key: 'gihun', name: '최기훈', old: null, neu: [f('ep01v3-001-gihun-portrait-DRAFT.webp'), f('ep01v3-001-gihun-name-DRAFT.svg')] },
        { key: 'jin', name: '서진석', old: null, neu: [f('ep01v3-001-jin-portrait-DRAFT.webp'), f('ep01v3-001-jin-name-DRAFT.svg')] }
      ], check: '보기: 이름 글자 위치·가독성, 인물 얼굴·나이(최기훈·서진석 40대 남성), 액자 화풍 일치' },
    { id: 'c16', cut: '16컷', title: '마우스를 잡은 손', what: '승민의 오른손이 흰 마우스를 쥐고 검지·중지가 버튼 위에 놓이게 고친 시안.',
      old: [f('ep01v3-016-staffroom-desk-REV2-DRAFT.webp')], neu: [f('ep01v3-016-natural-mouse-grip-DRAFT.webp')], check: '보기: 손 모양이 자연스러운지, 책상·모니터(사용자 바탕화면 사진)가 그대로인지' },
    { id: 'c41', cut: '41컷', title: '해인의 바지·다리', what: '문가에 선 해인의 바지와 두 다리를 부분 수정한 시안. (102컷 수정 시안은 이 비교에 포함하지 않습니다.)',
      old: [f('ep01v3-041-haein-doorway-DRAFT.webp')], neu: [f('ep01v3-041-haein-doorway-trousers-REV1-DRAFT.webp')], check: '보기: 다리가 두 개로 자연스럽게 읽히는지, 바지 주름·신발, 나머지 구도 유지' },
    { id: 'c43', cut: '43컷', title: '강당 입구 연출', what: '강당 밖에서 학생들이 입구로 걸어가고, 입구를 가리키는 인물(승민)을 보여 주는 시안. 대사는 본편 그대로이며 아래 제안은 반영되지 않았습니다.',
      old: [f('ep01v3-043-DRAFT.webp')], neu: [f('ep01v3-043-entrance-gesture-DRAFT.webp')], dialogue: true, check: '보기: 입구를 가리키는 인물이 승민인지, 학생 동선, 말풍선 자리(컷 아래 여백)' },
    { id: 'c57', cut: '57컷', title: '벽시계 크기', what: '10시 30분 벽시계 지름을 약 1/2로 줄인 시안. 시곗바늘은 본편에서 웹으로 따로 얹기 때문에 두 이미지 모두 바늘이 없습니다.',
      old: [f('ep01v3-057-DRAFT.webp')], neu: [f('ep01v3-057-half-size-clock-DRAFT.webp')], check: '보기: 시계 크기·위치가 문 위 벽에서 자연스러운지(바늘은 승인되면 시안에 맞춰 다시 맞춤)' },
    { id: 'c94a', cut: '94-a컷', title: '휴대폰 폭 (왼쪽 조각)', what: '92컷과 같은 기기 기준으로 휴대폰 폭을 줄인 시안. 화면은 웹 UI를 얹기 위해 비어 있어 시안에서는 회색입니다.',
      old: [f('ep01v3-094-a-thumb-REV1-DRAFT.webp')], neu: [f('ep01v3-094-a-slim-phone-DRAFT.webp')], check: '보기: 92컷 폰과 같은 크기감인지, 엄지가 받기 직전 동작으로 읽히는지' },
    { id: 'c94b', cut: '94-b컷', title: '휴대폰 폭 (오른쪽 조각)', what: '위와 같은 기준의 오른쪽 조각. 엄지가 이어서 누르는 동작입니다.',
      old: [f('ep01v3-094-b-thumb-REV1-DRAFT.webp')], neu: [f('ep01v3-094-b-slim-phone-DRAFT.webp')], check: '보기: 94-a와 폭·손 위치가 이어지는지' }
  ];
  var JUDGE = [];   /* 판단 대상: 1컷은 인물별이 아니라 컷 단위 1개로 본다 */
  ITEMS.forEach(function (it) { JUDGE.push(it.id); });

  var state = {}, verdict = {};
  try { verdict = JSON.parse(localStorage.getItem('ep01-compare-verdict') || '{}') || {}; } catch (e) { verdict = {}; }
  function saveV() { try { localStorage.setItem('ep01-compare-verdict', JSON.stringify(verdict)); } catch (e) {} }
  var VLABEL = { ok: '승인 후보', hold: '보류', no: '반려' };

  function cur(it) {
    if (!it.persons) return it;
    var k = state[it.id] ? state[it.id].person : 0;
    var p = it.persons[k];
    return { old: p.old, neu: p.neu, oldNote: p.oldNote, name: p.name };
  }
  function layerHtml(urls, alt) {
    return '<div class="layer">' + urls.map(function (u) { return '<img src="' + u + '" alt="' + (alt || '') + '" loading="lazy" decoding="async">'; }).join('') + '</div>';
  }
  function stageHtml(it, mode, pos) {
    var c = cur(it), o = c.old, n = c.neu;
    if (mode === 'old') return o ? '<span class="tag">기존 원화</span>' + layerHtml(o, '기존 원화') : '<div class="none">기존 원화 없음<br><small>본편 1컷에는 이 인물의 초상이 없습니다</small></div>';
    if (mode === 'new') return '<span class="tag new">수정 시안</span>' + layerHtml(n, '수정 시안');
    /* 슬라이더: 위에 수정 시안, 왼쪽 pos% 만 보이게 */
    if (!o) return '<div class="none">기존 원화가 없어 겹쳐 볼 수 없습니다</div>';
    return '<span class="tag">기존 원화</span><span class="tag new" style="left:auto;right:8px">수정 시안</span>' + layerHtml(o, '') +
      '<div class="cmp" style="clip-path:inset(0 ' + (100 - pos) + '% 0 0)">' + layerHtml(n, '') + '</div>';
  }
  function dialogueHtml() {
    var ep = window.WEBTOON.episodeData.ep01v3, cut = ep && ep.cuts.filter(function (c) { return c.no === 43; })[0];
    var cur = cut && cut.lines && cut.lines[0] ? cut.lines[0] : null;
    return '<div class="box"><div>본편 현재 대사 (변경 없음)</div>' +
      '<div><b>' + (cur ? esc(cur.who) : '부장') + '</b> · “' + (cur ? esc(cur.text) : '1학년 앞줄! 핸드폰 무음!') + '”</div>' +
      '<div style="margin-top:8px">변경 제안 (<b>미반영</b>)</div>' +
      '<div><b>승민</b> · “1학년은 들어가면 앞줄에 앉아요. 휴대폰은 미리 무음으로 해 주세요.”</div>' +
      '<small>배치 제안: 왼쪽 상단 경계, 꼬리는 승민 쪽. 안내하는 손은 가리지 않음. 45컷에서 부장이 음향석으로 보내는 대사와는 구분됩니다.<br>이전 안: “1학년은 들어가면 앞줄이에요! 들어가기 전에 휴대폰은 무음으로 해 주세요.”</small></div>';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function render() {
    document.getElementById('cards').innerHTML = ITEMS.map(function (it) {
      var st = state[it.id] || (state[it.id] = { mode: 'new', pos: 50, person: 0 });
      return '<section class="card" id="' + it.id + '" data-id="' + it.id + '">' +
        '<h2>' + it.cut + ' · ' + it.title + '</h2><p class="what">' + it.what + '</p>' +
        (it.persons ? '<div class="persons">' + it.persons.map(function (p, i) { return '<button data-person="' + i + '" aria-pressed="' + (st.person === i) + '">' + p.name + '</button>'; }).join('') + '</div>' : '') +
        '<div class="seg">' + [['old', '기존 원화'], ['new', '수정 시안'], ['cmp', '겹쳐 보기']].map(function (m) { return '<button data-mode="' + m[0] + '" aria-pressed="' + (st.mode === m[0]) + '">' + m[1] + '</button>'; }).join('') + '</div>' +
        '<div class="stage" data-zoom="1">' + stageHtml(it, st.mode, st.pos) + '</div>' +
        '<div class="slider' + (st.mode === 'cmp' ? ' on' : '') + '"><input type="range" min="0" max="100" value="' + st.pos + '" aria-label="기존 원화와 수정 시안 경계"></div>' +
        '<p class="hint">' + (it.check || '') + '</p>' +
        (it.dialogue ? dialogueHtml() : '') +
        '<div class="verdict">' + ['ok', 'hold', 'no'].map(function (v) { return '<button data-v="' + v + '" aria-pressed="' + (verdict[it.id] === v) + '">' + VLABEL[v] + '</button>'; }).join('') + '</div>' +
        '</section>';
    }).join('');
    updateChips();
  }
  function updateChips() {
    document.getElementById('chips').innerHTML = ITEMS.map(function (it) { return '<a href="#' + it.id + '" class="' + (verdict[it.id] ? 'done' : '') + '">' + it.cut + '</a>'; }).join('');
    var n = JUDGE.filter(function (id) { return verdict[id]; }).length;
    document.getElementById('count').textContent = n + ' / ' + JUDGE.length + ' 판단';
  }
  function refresh(card) {
    var it = ITEMS.filter(function (x) { return x.id === card.dataset.id; })[0], st = state[it.id];
    card.querySelector('.stage').innerHTML = stageHtml(it, st.mode, st.pos);
    card.querySelectorAll('.seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === st.mode)); });
    card.querySelector('.slider').classList.toggle('on', st.mode === 'cmp');
    card.querySelectorAll('.persons button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.person === st.person)); });
  }
  document.getElementById('cards').addEventListener('click', function (e) {
    var card = e.target.closest('.card'); if (!card) return;
    var id = card.dataset.id, st = state[id];
    var b = e.target.closest('button');
    if (b && b.dataset.mode) { st.mode = b.dataset.mode; return refresh(card); }
    if (b && b.dataset.person != null) { st.person = +b.dataset.person; return refresh(card); }
    if (b && b.dataset.v) { verdict[id] = verdict[id] === b.dataset.v ? undefined : b.dataset.v; if (!verdict[id]) delete verdict[id]; saveV(); card.querySelectorAll('.verdict button').forEach(function (x) { x.setAttribute('aria-pressed', String(verdict[id] === x.dataset.v)); }); return updateChips(); }
    if (e.target.closest('.stage')) openZoom(id);
  });
  document.getElementById('cards').addEventListener('input', function (e) {
    if (e.target.type !== 'range') return;
    var card = e.target.closest('.card'), st = state[card.dataset.id]; st.pos = +e.target.value;
    var c = card.querySelector('.cmp'); if (c) c.style.clipPath = 'inset(0 ' + (100 - st.pos) + '% 0 0)';
  });

  /* 확대 보기 */
  var zoomId = null;
  function zoomDraw() {
    var it = ITEMS.filter(function (x) { return x.id === zoomId; })[0], st = state[zoomId], c = cur(it);
    var mode = st.mode === 'cmp' ? 'new' : st.mode;
    var layers = mode === 'old' ? c.old : c.neu;
    document.getElementById('zinner').innerHTML = layers ? layers.map(function (u) { return '<img src="' + u + '" alt="">'; }).join('') : '<div style="color:#9aa3ad;padding:40px;line-height:1.5">기존 원화 없음</div>';
    document.getElementById('zseg').innerHTML = [['old', '기존 원화'], ['new', '수정 시안']].map(function (m) { return '<button data-m="' + m[0] + '" aria-pressed="' + (mode === m[0]) + '">' + m[1] + '</button>'; }).join('');
    document.getElementById('zcap').textContent = it.cut + ' · ' + it.title + (c.name ? ' · ' + c.name : '') + ' — ' + (mode === 'old' ? '기존 원화' : '수정 시안') + ' (밀어서 확대 부분 보기)';
  }
  function openZoom(id) { zoomId = id; var st = state[id]; if (st.mode === 'cmp') st.mode = 'new'; zoomDraw(); document.getElementById('zoom').classList.add('on'); document.getElementById('zoom').setAttribute('aria-hidden', 'false'); document.getElementById('zview').scrollTo(0, 0); }
  function closeZoom() { document.getElementById('zoom').classList.remove('on'); document.getElementById('zoom').setAttribute('aria-hidden', 'true'); var card = document.getElementById(zoomId); if (card) refresh(card); }
  document.getElementById('zseg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; state[zoomId].mode = b.dataset.m; var sx = document.getElementById('zview').scrollLeft, sy = document.getElementById('zview').scrollTop; zoomDraw(); document.getElementById('zview').scrollTo(sx, sy); });
  document.getElementById('zclose').addEventListener('click', closeZoom);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('zoom').classList.contains('on')) closeZoom(); });

  /* 판단 요약 */
  function summary() {
    var lines = ['EP01 수정 시안 판단'];
    ITEMS.forEach(function (it) { lines.push(it.cut + ' ' + it.title + ': ' + (VLABEL[verdict[it.id]] || '미판단')); });
    lines.push('(43컷 대사 변경 제안은 별도 판단 필요 — 이 페이지는 본편을 바꾸지 않습니다)');
    return lines.join('\n');
  }
  document.getElementById('show').addEventListener('click', function () { var o = document.getElementById('out'); o.textContent = summary(); o.classList.toggle('on'); window.scrollTo(0, 0); });
  document.getElementById('copy').addEventListener('click', function () {
    var t = summary(), b = this, done = function () { b.textContent = '복사됨'; setTimeout(function () { b.textContent = '요약 복사'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { document.getElementById('out').textContent = t; document.getElementById('out').classList.add('on'); });
    else { document.getElementById('out').textContent = t; document.getElementById('out').classList.add('on'); }
  });
  render();
})();
</script>
</body>
</html>
