<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>그림 최적화</title>
<!--
  그림 최적화 (tools/qa/optimize.ps1 이 실행). 직접 열면 계획만 보여 준다.
    ?mode=plan                       컷 데이터에서 그림마다 "필요한 최대 픽셀 폭"을 계산해 /__qa/result 로 보낸다
    ?mode=encode&src=…&q=0.92&w=…    한 파일을 (w 가 있으면 그 폭으로 줄여) 손실 WebP 로 다시 저장하고,
                                     원본과의 차이(PSNR)를 /__qa/baseline 에, 새 파일을 /__qa/result 에 보낸다
  필요한 폭 = 레이어 가로 % × 본문 최대 폭 720px × 픽셀 밀도 2 (태블릿) — 이보다 큰 원본만 줄인다.
  휴대폰(최대 430px × 3배 = 1290px)은 이 값보다 작으므로 어느 기기에서도 화면 해상도보다 낮아지지 않는다.
-->
</head><body><pre id="out"></pre>
<script src="../../data/episodes.js"></script>
<script src="../../data/characters.js"></script>
<script src="../../js/compose.js"></script>
<script>
(async function () {
  var Q = new URLSearchParams(location.search), ROOT = '../../', W = window.WEBTOON;
  var MAXPX = 720 * 2;
  function post(path, body) { return fetch(path, { method: 'POST', body: body }); }
  function load(src) { return new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = src; }); }

  if (Q.get('mode') === 'plan') {
    await new Promise(function (ok) { var s = document.createElement('script'); s.src = ROOT + 'data/ep01.js'; s.onload = ok; document.head.appendChild(s); });
    var ep = W.episodeData.ep01, need = {};
    function use(path, frac, cut) {
      if (!path || /\.svg$/.test(path)) return;
      var n = need[path] = need[path] || { px: 0, cuts: [] };
      n.px = Math.max(n.px, Math.ceil(frac * MAXPX)); if (n.cuts.indexOf(cut) < 0) n.cuts.push(cut);
    }
    ep.cuts.forEach(function (c) {
      if (c.image) use(W.compose.resolve(c.image, ep.imageBase), 1, c.no);
      var m = c.compose; if (!m) return;
      if (m.bg) {   /* 배경은 cover: 캔버스 비율과 그림 비율로 확대율이 정해진다 → 원본 폭이 필요 폭의 기준이 되도록 1 이상 */
        use(W.compose.resolve(m.bg, ep.imageBase), 1, c.no); need[W.compose.resolve(m.bg, ep.imageBase)].cover = true;
      }
      (m.layers || []).forEach(function (l) { use(W.compose.resolve(l.src, ep.imageBase), (+l.w || 100) / 100, c.no); });
    });
    var rows = [];
    for (var p in need) {
      var im; try { im = await load(ROOT + p); } catch (e) { continue; }
      var head = new Uint8Array(await (await fetch(ROOT + p)).arrayBuffer());
      var kind = String.fromCharCode(head[12], head[13], head[14], head[15]);
      rows.push({ path: p, w: im.naturalWidth, h: im.naturalHeight, bytes: head.length, kind: kind.trim(), needPx: need[p].px, cover: !!need[p].cover, cuts: need[p].cuts });
    }
    await post('/__qa/result', JSON.stringify(rows, null, 1));
    document.title = 'plan done'; return;
  }

  if (Q.get('mode') === 'encode') {
    var src = Q.get('src'), q = +Q.get('q') || 0.92, tw = +Q.get('w') || 0;
    var im2 = await load(ROOT + src), W0 = im2.naturalWidth, H0 = im2.naturalHeight;
    var w = tw && tw < W0 ? tw : W0, h = Math.round(H0 * w / W0);
    /* 줄일 때는 절반씩 단계적으로 줄여 계단 현상을 막는다 */
    var cur = im2, cw = W0, ch = H0;
    while (cw / 2 >= w) { var t = document.createElement('canvas'); t.width = Math.round(cw / 2); t.height = Math.round(ch / 2); var tg = t.getContext('2d'); tg.imageSmoothingQuality = 'high'; tg.drawImage(cur, 0, 0, t.width, t.height); cur = t; cw = t.width; ch = t.height; }
    var c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, w, h);
    var blob = await new Promise(function (ok) { c.toBlob(ok, 'image/webp', q); });
    /* 차이 측정: 새 파일을 다시 열어, 같은 크기로 줄인 원본(무압축)과 회색 배경 위 합성 색·알파를 비교 */
    var back = await load(URL.createObjectURL(blob));
    function pixels(img) { var k = document.createElement('canvas'); k.width = w; k.height = h; var kg = k.getContext('2d'); kg.drawImage(img, 0, 0, w, h); return kg.getImageData(0, 0, w, h).data; }
    var A = pixels(c), B = pixels(back), se = 0, n = 0, ae = 0, amax = 0;
    for (var i = 0; i < A.length; i += 4) {
      var aa = A[i + 3] / 255, ab = B[i + 3] / 255; ae += Math.abs(A[i + 3] - B[i + 3]); amax = Math.max(amax, Math.abs(A[i + 3] - B[i + 3]));
      if (!A[i + 3] && !B[i + 3]) continue;
      for (var ch2 = 0; ch2 < 3; ch2++) { var va = A[i + ch2] * aa + 128 * (1 - aa), vb = B[i + ch2] * ab + 128 * (1 - ab); se += (va - vb) * (va - vb); n++; }
    }
    var psnr = n ? 10 * Math.log10(255 * 255 / (se / n)) : 99;
    await post('/__qa/baseline', JSON.stringify({ src: src, from: W0 + 'x' + H0, to: w + 'x' + h, q: q, bytes: blob.size, psnr: Math.round(psnr * 10) / 10, alphaMeanErr: Math.round(ae / (A.length / 4) * 1000) / 1000, alphaMaxErr: amax }));
    await post('/__qa/result', blob);
    document.title = 'encode done'; return;
  }
  document.getElementById('out').textContent = '?mode=plan 또는 ?mode=encode&src=… 로 실행 (tools/qa/optimize.ps1)';
})();
</script></body></html>
